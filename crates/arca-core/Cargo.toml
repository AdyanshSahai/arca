[package]
name = "arca-core"
version = "0.1.0"
description = "Headless engine behind Arca: vault I/O, post-its, wiki-links and Tantivy search"
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
# Full-text search engine; we only use its in-RAM index.
tantivy = "0.27"
# Wiki-link / tag / post-it marker parsing.
regex = "1"
# Every public result type is serialised straight to the frontend as JSON.
serde = { version = "1", features = ["derive"] }
# Recursive vault scans that skip hidden folders.
walkdir = "2"
thiserror = "2"
# Markdown → HTML for the export pipeline (tables, tasks, footnotes…).
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
# Embedding local images into exported HTML as data: URIs.
base64 = "0.22"
# The trash index (.trash/.index.json: where each trashed item came from).
serde_json = "1"
git2 = { version = "0.20", default-features = false, features = ["vendored-libgit2"] }

[dev-dependencies]
# Throwaway vault directories for the tests.
tempfile = "3"
