# Cargo workspace for Arca.
#
#   crates/arca-core  – pure-Rust engine: vault file I/O, post-it parsing,
#                       wiki-link graph and the Tantivy search index. It has
#                       no GUI dependencies, so it can be unit-tested headless.
#   src-tauri         – the thin Tauri v2 desktop shell that exposes the core
#                       to the React frontend as IPC commands.
[workspace]
members = ["crates/arca-core", "src-tauri"]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
authors = ["Adyansh Sahai"]

# Dev builds (`tauri dev`, `npm run sandbox`) optimise every *dependency*
# (Tantivy, regex, serde, Tauri…) while Arca's own crates stay unoptimised
# for fast rebuilds. Unoptimised Tantivy made backend work 5-17x slower than
# in release builds; dependencies only recompile when they change, so this
# costs one slower first build.
[profile.dev.package."*"]
opt-level = 3

# The engine itself is small and hot (graph, backlinks, tree, fuzzy search),
# so it's optimised in dev too; only the thin Tauri shell stays unoptimised.
[profile.dev.package.arca-core]
opt-level = 2

[profile.release]
# Smaller, faster release binaries; the app is distributed as a single exe.
lto = true
codegen-units = 1
strip = true
