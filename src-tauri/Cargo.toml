[package]
name = "arca"
version = "0.1.0"
description = "Local-first markdown vault with chapter trees, post-its, wiki-links and Tantivy search"
edition.workspace = true
license.workspace = true
authors.workspace = true

[lib]
# The `_lib` suffix avoids a name clash with the `arca` binary on Windows.
name = "arca_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
arca-core = { path = "../crates/arca-core" }
tauri = { version = "2", features = [] }
# Native "pick a vault folder" dialog.
tauri-plugin-dialog = "2"
# Opening URLs and local files (PDF textbooks…) with the system's default app.
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# File-system watching so edits made outside Arca show up live.
notify = "8"
notify-debouncer-full = "0.5"
